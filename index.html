<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOOH — Neon Filter Lab</title>
<style>
:root{--green:#00ff19;--black:#050505}
*{box-sizing:border-box}body{margin:0;background:#101010;color:#f4f4f4;font-family:Tahoma,Arial,sans-serif}
main{max-width:900px;margin:auto;padding:22px}header{border-bottom:1px solid #333;padding-bottom:14px;margin-bottom:18px}
h1{font-size:26px;margin:0 0 8px;letter-spacing:2px}p{color:#bbb;line-height:1.8;margin:8px 0}
.panel{background:#1a1a1a;border:1px solid #333;border-radius:14px;padding:16px;margin:14px 0}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
label{display:block;font-size:14px;margin-bottom:8px;color:#ddd}input[type=range]{width:100%;accent-color:var(--green)}
input[type=file]{max-width:100%;color:#ddd}
button{background:var(--green);color:#000;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer;margin:5px 0}
button.secondary{background:#333;color:#fff;border:1px solid #555}
canvas{display:block;width:100%;max-height:75vh;object-fit:contain;background:#050505;border-radius:10px}
small{color:#999}.values{color:var(--green);font-weight:bold}
</style>
</head>
<body><main>
<header><h1>KOOH / NEON FILTER LAB</h1><p>عکس رو انتخاب کن، افکت سبز نئونی و مشکی رو تنظیم کن و خروجی استوری بگیر.</p></header>
<section class="panel">
<label for="file">۱. انتخاب عکس</label><input id="file" type="file" accept="image/*">
</section>
<section class="panel controls">
<div><label>آستانه کنتراست <span class="values" id="thv">128</span></label><input id="th" type="range" min="40" max="220" value="128"></div>
<div><label>شدت سبز <span class="values" id="gv">255</span></label><input id="green" type="range" min="120" max="255" value="255"></div>
<div><label>دانه‌دانه / گرین <span class="values" id="nv">0</span></label><input id="noise" type="range" min="0" max="70" value="0"></div>
<div><label>جزئیات سایه <span class="values" id="dv">1</span></label><input id="detail" type="range" min="0" max="3" step="1" value="1"></div>
</section>
<section class="panel"><canvas id="out" width="720" height="1280"></canvas><p><small>برای نتیجه بهتر عکس پرنور و با جزئیات واضح انتخاب کن. پردازش داخل همین مرورگر انجام می‌شود.</small></p>
<button id="download">دانلود PNG</button><button id="reset" class="secondary">بازگشت به تنظیمات اولیه</button></section>
</main>
<script>
const file=document.getElementById('file'), canvas=document.getElementById('out'),ctx=canvas.getContext('2d');
const controls=['th','green','noise','detail'];let source=null;
function redraw(){
 if(!source)return;
 const threshold=+th.value,green=+document.getElementById('green').value,noise=+document.getElementById('noise').value,detail=+document.getElementById('detail').value;
 // fit photo to vertical story canvas (9:16), cropping center
 const W=720,H=1280;canvas.width=W;canvas.height=H;
 const scale=Math.max(W/source.width,H/source.height),sw=source.width*scale,sh=source.height*scale;
 ctx.drawImage(source,(W-sw)/2,(H-sh)/2,sw,sh);
 const im=ctx.getImageData(0,0,W,H),d=im.data;
 // luminance + adjustable posterized duotone and subtle random texture
 const levels=2+detail;
 for(let i=0;i<d.length;i+=4){
   const lum=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];
   const n=(Math.random()-.5)*noise;
   const v=lum+n;
   const blackCut=Math.max(0,threshold-20-detail*12);
   const isGreen=v>blackCut;
   // harsher threshold with scattered grain
   const speckle=Math.random()*100;
   let greenPixel=isGreen;
   if(noise>0 && speckle<noise*.22) greenPixel=!greenPixel;
   d[i]=greenPixel?0:0;d[i+1]=greenPixel?green:0;d[i+2]=greenPixel?Math.max(0,Math.floor(green*.10)):0;d[i+3]=255;
 }
 ctx.putImageData(im,0,0);
 ['th','green','noise','detail'].forEach(id=>document.getElementById(id+'v').textContent=document.getElementById(id).value);
}
file.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{source=img;redraw()};img.src=URL.createObjectURL(f)});
controls.forEach(id=>document.getElementById(id).addEventListener('input',redraw));
document.getElementById('download').onclick=()=>{if(!source){alert('اول یه عکس انتخاب کن');return;}const a=document.createElement('a');a.download='KOOH-neon-story.png';a.href=canvas.toDataURL('image/png');a.click()};
document.getElementById('reset').onclick=()=>{th.value=128;green.value=255;noise.value=0;detail.value=1;redraw()};
</script></body></html>
